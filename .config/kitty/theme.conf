# Tokyo Night (matches ghostty themes/tokyo-night-default)

foreground #c0caf5
background #212121

# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26

# Selection
selection_foreground #c0caf5
selection_background #283457

# URL highlight
url_color #9ece6a

# Window borders
active_border_color #3d59a1
inactive_border_color #101014
bell_border_color #e0af68

# Tab bar — fully owned by tab_bar.py (custom)
#   tab_bar_background intentionally unset → defaults to the terminal
#   background so the bar blends in (only chips drawn by tab_bar.py
#   carry an accent color).
tab_bar_edge            top
tab_bar_style           custom
tab_bar_min_tabs        1
tab_bar_margin_width    0
active_tab_font_style   bold
inactive_tab_font_style normal

# Titlebar (transparent, like ghostty macos-titlebar-style = transparent)
macos_titlebar_color background
