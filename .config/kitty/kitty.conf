include theme.conf

# BEGIN_KITTY_FONTS
font_family      family="Maple Mono"
bold_font        family='Maple Mono' style=Bold variable_name=MapleMono
italic_font      auto
bold_italic_font family='Maple Mono' style=Bold variable_name=MapleMono
font_size 11
modify_font cell_height 5px
# END_KITTY_FONTS


# Cursor Configuration
cursor_shape block
cursor_trail 1
cursor_trail_decay 0.1 0.45
cursor_trail_start_threshold 2

# Clipboard/Paste Configuration
clipboard_control write-clipboard write-primary read-clipboard read-primary no-append
select_by_word_characters @-./_~?&=%+#
strip_trailing_spaces smart
copy_on_select yes
paste_actions quote-urls-at-prompt


# Window Configuration (mirrors ghostty: opacity 0.9, blur 20, padding 10/8)
window_padding_width 8 10
remember_window_size yes
confirm_os_window_close 1

# Layout — splits allows arbitrary h/v splitting; stack for zoom
enabled_layouts tall:bias=65;full_size=1;mirrored=false

# Window navigation with alt+hjkl
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down
map cmd+d new_window_with_cwd
map cmd+enter new_window_with_cwd
map cmd+w close_window

# tab management
map cmd+right next_tab
map cmd+left previous_tab
map cmd+shift+h previous_tab
map cmd+shift+l next_tab

# Jump to tab by number (cmd+0 → tab 10, like the tmux M-0 binding)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# MacOS Specific
macos_option_as_alt left
macos_show_window_title_in none


map ctrl+p command_palette

# Theme switching — applies to all windows and saves as the new default for
# subsequently spawned ones. Startup default is whatever `include` at the
# top points at; change that line to flip the default at launch.
map f7 set_colors --all --configured ~/.config/kitty/GitHub\ Light.conf
map f8 set_colors --all --configured ~/.config/kitty/theme.conf
