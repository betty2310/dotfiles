# vim:ft=kitty

## name: GitHub Light
## author: GitHub
## license: MIT

#: The basic colors

foreground #24292f
background #ffffff
selection_foreground #ffffff
selection_background #0969da


#: Cursor colors

cursor #0969da
cursor_text_color #ffffff


#: Tab bar colors
#  tab_bar_background is intentionally unset → defaults to the terminal
#  background so the bar blends in (only the chips drawn by tab_bar.py
#  carry an accent color).

active_tab_foreground   #24292f
active_tab_background   #ffffff
inactive_tab_foreground #57606a
inactive_tab_background #ffffff


#: The basic 16 colors

#: black
color0 #24292f
color8 #57606a

#: red
color1 #cf222e
color9 #a40e26

#: green
color2  #116329
color10 #1a7f37

#: yellow  (warmer than the GitHub default so the right-side chip reads
#          as gold, matching the Tokyo Night variant)
color3  #9a6700
color11 #bf8700

#: blue
color4  #0969da
color12 #218bff

#: magenta
color5  #8250df
color13 #a475f9

#: cyan
color6  #1b7c83
color14 #3192aa

#: white
color7  #6e7781
color15 #8c959f


# URL highlight
url_color #1a7f37

# Window borders
active_border_color   #0969da
inactive_border_color #d0d7de
bell_border_color     #bf8700

# Tab bar — fully owned by tab_bar.py (custom)
tab_bar_edge            top
tab_bar_style           custom
tab_bar_min_tabs        1
tab_bar_margin_width    0
active_tab_font_style   bold
inactive_tab_font_style normal

# Titlebar (transparent, matches theme.conf)
macos_titlebar_color background
